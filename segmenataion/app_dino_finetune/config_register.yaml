# config_register.yaml
# Configuration for: python save_mlflow_wrapper.py
# Run this BEFORE finetune.py.
# Registers the pretrained lightly_train model to MLflow so finetune.py
# can download it from the registry.

# ---------------------------------------------------------------------------
# MLflow
# ---------------------------------------------------------------------------
mlflow:
  tracking_uri:    "http://localhost:5000"   # overridden by env MLFLOW_TRACKING_URI_OUTSIDE
  experiment_name: "dinov3_segmentation"
  base_model_name: "dinov3/vits16-eomt-cityscapes"    # name to register the model under

# ---------------------------------------------------------------------------
# Pretrained model to register
# ---------------------------------------------------------------------------
checkpoint:
  base_model: "dinov3/vits16-eomt-cityscapes"

# ---------------------------------------------------------------------------
# Where the pretrained checkpoint lives locally
# save_mlflow_wrapper.py reads: <out_dir>/<base_model>/checkpoints/best.ckpt
# ---------------------------------------------------------------------------
finetune:
  out_dir: "/Users/xiaoyachong/Documents/3RSE/mlex_tomo_framework/data/lightly_out_finetuned"

# ---------------------------------------------------------------------------
# Pip requirements stored inside the MLflow model artifact
# ---------------------------------------------------------------------------
pip_requirements:
  - "lightly-train==0.13.2"
  - "numpy==2.2.6"
  - "torch==2.9.1"
  - "torchvision==0.24.1"
  - "pytorch-lightning==2.6.0"
  - "Pillow"
  - "mlflow==2.22.0"
