# config_finetune.yaml
# Configuration for: python finetune.py

# ---------------------------------------------------------------------------
# Model — lightly_train pretrained model to finetune
# ---------------------------------------------------------------------------
checkpoint:
  # Passed as `model=` to train_semantic_segmentation.
  # Downloaded automatically to cache_dir if not already present.
  base_model: "dinov3/vits16-eomt-cityscapes"

# ---------------------------------------------------------------------------
# Cache directories for model weights and lightly_train internals
# ---------------------------------------------------------------------------
cache:
  lightly_train_cache_dir:       "/Users/xiaoyachong/Documents/3RSE/mlex_tomo_framework/data/lightly_cache"
  lightly_train_model_cache_dir: "/Users/xiaoyachong/Documents/3RSE/mlex_tomo_framework/data/lightly_cache"
  torch_home:                    "/Users/xiaoyachong/Documents/3RSE/mlex_tomo_framework/data/lightly_cache"

# ---------------------------------------------------------------------------
# Tiled data source
# Images and masks live in separate containers.
# URIs overridden by env DATA_TILED_URI_IMAGES / DATA_TILED_URI_MASKS
# API key overridden by env TILED_API_KEY
# ---------------------------------------------------------------------------
tiled:
  images_uri:   "http://tiled:8000/api/v1/metadata/recons/42tiff"
  masks_uri:    "http://tiled:8000/api/v1/metadata/recons/42tiff_7classes_masks"
  api_key:      null
  val_split:    0.2   # 20% of data used for validation, 80% for training

# ---------------------------------------------------------------------------
# Dataset / classes
# ---------------------------------------------------------------------------
dataset:
  classes:
    0:   "background"
    1:   "cortex"
    2:   "Phloem Fibers"
    3:   "Phloem"
    4:   "Hydrated Xylem vessels"
    5:   "Air-based Pith cells"
    6:   "Water-based Pith cells"
    7:   "Dehydrated Xylem vessels"
    255: "unknown"
  ignore_classes: [255]

# ---------------------------------------------------------------------------
# Finetuning hyper-parameters
# ---------------------------------------------------------------------------
finetune:
  steps:      2000
  batch_size: 1           # global batch size; per-GPU = batch_size / num_gpus
  num_nodes:  1           # overridden by SLURM_NNODES at runtime
  devices:    "auto"      # uses all visible GPUs per node
  # Final out_dir is resolved at runtime as: out_dir / base_model
  # e.g. .../lightly_out_finetuned/dinov3/vitl16-eomt-cityscapes
  out_dir: "/Users/xiaoyachong/Documents/3RSE/mlex_tomo_framework/data/lightly_out_finetuned"
  log_every_num_steps:     100
  val_every_num_steps:     200
  val_log_every_num_steps: 100
  save_every_num_steps:    500
  save_last: true
  save_best:  true

# ---------------------------------------------------------------------------
# MLflow — only needed to register the finetuned model at the end
# ---------------------------------------------------------------------------
mlflow:
  tracking_uri:          "http://localhost:5000"  # overridden by env MLFLOW_TRACKING_URI_OUTSIDE
  experiment_name:       "petiole_segmentation"
  finetuned_model_name:  "petiole_vitl16_eomt_ft"

# ---------------------------------------------------------------------------
# Pip requirements stored inside the finetuned MLflow model artifact
# ---------------------------------------------------------------------------
pip_requirements:
  - "lightly-train==0.13.2"
  - "numpy==2.2.6"
  - "torch==2.9.1"
  - "torchvision==0.24.1"
  - "pytorch-lightning==2.6.0"
  - "Pillow"
  - "mlflow==2.22.0"

# ---------------------------------------------------------------------------
# Scratch — shared filesystem path for PNG data dumps
# ---------------------------------------------------------------------------
scratch:
  data_dir: "${SCRATCH}/lightly_finetune_data"
