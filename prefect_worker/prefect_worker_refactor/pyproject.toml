[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_api", "inference_service", "worker/flows"]

[project]
name = "mlexworker"
version = "0.3.0"
description = "MLExchange job submission: FastAPI Job API + Prefect child workers + inference service"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"

# Shared by everything (schemas, Prefect client)
dependencies = [
    "prefect==3.4.2",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
# Job API: no PyTorch. mlflow-skinny is enough for registry/run metadata.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "mlflow-skinny==2.22.0",
]
# Prefect child workers (docker / podman / conda / slurm / sfapi)
worker = [
    "typer==0.15.4",
    "requests>=2.31.0",
    "sfapi-client>=0.4.0",
    "authlib>=1.2.0",
    "globus-sdk>=3.0",
    "httpx",
]
# Inference service: the ONLY place PyTorch is installed
inference = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "mlflow==2.22.0",
    "numpy",
    "torch",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pre-commit",
    "flake8",
]

[tool.pytest.ini_options]
pythonpath = [".", "worker"]
testpaths = ["tests"]
